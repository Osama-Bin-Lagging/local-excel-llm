<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <title>Local LLM Workbook</title>
  <!-- Shared runtime: full office.js (Excel API + custom functions), all served locally -->
  <script src="https://localhost:3000/office.js" type="text/javascript"></script>
  <script src="https://localhost:3000/formula-parser.js" type="text/javascript"></script>
  <script>window.LOKUP_NO_ASSOCIATE = true; // reuse LOKUP's helpers here without registering LOKUP.H / LOKUP.V again</script>
  <script src="https://localhost:3000/functions.js" type="text/javascript"></script>
  <script src="https://localhost:3000/workbook-functions.js" type="text/javascript"></script>
</head>
<body style="font-family: -apple-system, Arial, sans-serif; padding: 16px;">
  <h3>Local LLM Workbook</h3>
  <p>Loaded: <code>=LOOOKUP.H(prompt, [model])</code>.</p>
</body>
</html>
